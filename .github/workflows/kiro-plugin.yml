name: Kiro plugin

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "cmd/kiro-plugin/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/kiro-plugin.yml"
  pull_request:
    paths:
      - "cmd/kiro-plugin/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/kiro-plugin.yml"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build DLL
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -buildmode=c-shared -o dist/kiro.dll ./cmd/kiro-plugin
      - name: Generate SHA-256
        run: |
          $hash = (Get-FileHash dist/kiro.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  kiro.dll" | Set-Content -NoNewline -Encoding ascii dist/kiro.dll.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: kiro-windows-amd64
          path: |
            dist/kiro.dll
            dist/kiro.h
            dist/kiro.dll.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: kiro-windows-amd64
          path: dist
      - name: Publish plugin release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/kiro.dll \
            dist/kiro.h \
            dist/kiro.dll.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Kiro plugin $GITHUB_REF_NAME" \
            --generate-notes
